{% extends "base.html" %}
{% block title %}Log In — AI Interview Analyzer{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Log in to continue tracking your interview progress.</p>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group text-left">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <div class="form-group text-left">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-group text-left flex gap-2" style="align-items:center;">
        <input type="checkbox" id="remember" name="remember" style="width:auto;">
        <label for="remember" style="margin:0;font-weight:500;">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <p class="auth-footer">Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
  </div>
</div>
{% endblock %}
